[project]
name = "fastapi-cls-view"
version = "0.1.1"
description = "Class-based views for FastAPI: fields as dependencies, routes as methods, hooks as in pydantic"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yurii Karabas", email = "1998uriyyo@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastapi-injected>=0.6.0",
]

[project.optional-dependencies]
examples = [
    "sqlalchemy>=2.0.40",
    "pyjwt>=2.10.0",
    "fastapi-pagination>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "pre-commit>=4.6.1",
    "fastapi-cls-view[examples]",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "ALL",  # select all checks by default
]
ignore = [
    # single rule exclude
    "S101",    # allow assert usage
    "PLR2004", # allow to compare with "magic numbers"
    "TRY003",  # allow message in exception class

    # full rule exclude
    "D",   # ignore docstrings
    "FA",  # ignore future annotations
    "ANN", # ignore annotations
    "FIX", # ignore FIXMEs
    "TD",  # ignore all TODOs
    "ARG", # ignore unused arguments
    "FBT", # ignore flake8-boolean-trap
    "EM",  # ignore error message formatting
    "TC",  # ignore type checking
    "CPY", # ignore copyright
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
]
per-file-ignores = { }
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["fastapi_cls_view"]

[tool.coverage.run]
source = ["fastapi_cls_view"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "@overload",
    "if TYPE_CHECKING:",
]
